<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>找不到這一頁｜黑熊 Obear</title>
<link rel="icon" type="image/png" sizes="32x32" href="https://obearwu.github.io/ObearSite/assets/icon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700;900&family=Noto+Sans+TC:wght@400;700&display=swap">
<style>
:root{--paper:#fff;--ground:#f1f1f1;--ink:#262626;--ink-2:#5c5a5a;--rule:#dcdad9;--red:#f80b28;--red-ink:#c4071f;--btn:#c4071f;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--paper:#161515;--ground:#0e0d0d;--ink:#ece9e7;--ink-2:#a8a4a2;--rule:#34312f;--red:#ff3d55;--red-ink:#ff6b7e;--btn:#c4071f;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font:16px/1.85 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:12vh 24px 64px}
.code{font-family:"Noto Serif TC","Songti TC",serif;font-weight:900;font-size:clamp(72px,18vw,128px);line-height:1;color:var(--red);margin:0 0 8px}
h1{font-family:"Noto Serif TC","Songti TC",serif;font-size:clamp(24px,5vw,32px);margin:0 0 12px}
p{margin:0 0 20px;color:var(--ink-2)}
.go{display:flex;flex-wrap:wrap;gap:12px;margin:24px 0 36px}
.go a{display:inline-flex;align-items:center;min-height:46px;padding:10px 22px;font-weight:700;text-decoration:none;border:1px solid var(--ink);color:var(--ink)}
.go a.primary{background:var(--btn);border-color:var(--btn);color:#fff}
.go a:focus-visible{outline:2px solid var(--red);outline-offset:3px}
small{color:var(--ink-2)}
</style>
</head>
<body>
<main>
  <p class="code" aria-hidden="true">404</p>
  <h1>這一頁不見了</h1>
  <p>網址可能打錯了，或是這一頁已經搬家。從下面兩個地方開始找就好。</p>
  <div class="go">
    <a class="primary" href="https://obearwu.github.io/ObearSite/">回黑熊的首頁</a>
    <a href="https://obearwu.github.io/ObearSite/#works">收聽《上班喝什麼？》</a>
  </div>
  <small>想找黑熊聊聊？到首頁最下方留言，或 IG 私訊 @obear.tw。</small>
</main>

</html>
